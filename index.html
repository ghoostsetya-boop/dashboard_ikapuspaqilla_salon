<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Management Keuangan Salon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffe0e6,#ffd1dc,#ffc0cb);
min-height:100vh;
overflow-x:hidden;
}

/* LOGIN */
#loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
text-align:center;
animation:fadeIn 1.5s ease-in-out;
}

.login-box{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
width:90%;
max-width:400px;
animation:float 3s infinite ease-in-out;
}

.login-box img{
width:130px;
height:130px;
border-radius:50%;
margin-bottom:20px;
animation:rotateLogo 8s linear infinite;
}

.login-box h2{
color:#ff6f91;
margin-bottom:20px;
font-weight:600;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ffd1dc;
outline:none;
}

.login-box button{
width:100%;
padding:12px;
border:none;
background:#ff8fab;
color:white;
border-radius:12px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.login-box button:hover{
background:#ff6f91;
transform:scale(1.05);
}

/* DASHBOARD */
#dashboard{
display:none;
}

header{
background:#ffb3c6;
padding:30px;
text-align:center;
border-radius:0 0 40px 40px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
position:sticky;
top:0;
z-index:1000;
animation:fadeDown 1s ease;
}

header img{
width:150px;
margin-bottom:10px;
}

header h1{
color:white;
font-size:24px;
font-weight:700;
}

.container{
display:flex;
}

/* SIDEBAR */
.sidebar{
width:70px;
background:white;
height:calc(100vh - 160px);
box-shadow:5px 0 20px rgba(0,0,0,0.1);
padding-top:20px;
position:fixed;
top:160px;
left:0;
border-radius:0 20px 20px 0;
}

.sidebar button{
display:block;
width:100%;
padding:15px 5px;
border:none;
background:none;
cursor:pointer;
font-size:12px;
color:#ff6f91;
transition:0.3s;
}

.sidebar button:hover{
background:#ffe0e6;
transform:scale(1.05);
}

/* CONTENT */
.content{
margin-left:80px;
padding:20px;
width:100%;
}

iframe{
width:100%;
height:75vh;
border:none;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
background:white;
animation:fadeIn 1s ease;
}

/* FOOTER */
footer{
background:#ffb3c6;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
border-radius:30px 30px 0 0;
}

footer img{
width:40px;
}

/* ANIMATION */
@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes fadeDown{
from{transform:translateY(-40px);opacity:0;}
to{transform:translateY(0);opacity:1;}
}

@keyframes rotateLogo{
0%{transform:rotate(0);}
100%{transform:rotate(360deg);}
}

/* RESPONSIVE */
@media(max-width:768px){
.sidebar{
width:60px;
}
.content{
margin-left:70px;
}
header img{
width:100px;
}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-box">
<img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s">
<h2>Selamat Datang di Dashboard Ikapuspaqilla Salon<br>Silahkan Login terlebih dahulu</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<header>
<img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s">
<h1>Dashboard Management Keuangan Salon</h1>
</header>

<div class="container">

<div class="sidebar">
<button onclick="loadPage('jurnal.html')">Jurnal</button>
<button onclick="loadPage('pengeluaran.html')">Pengeluaran</button>
<button onclick="loadPage('omset.html')">Omset</button>
<button onclick="loadPage('komisi.html')">Komisi</button>
<button onclick="loadPage('member.html')">Member</button>
</div>

<div class="content">
<iframe id="frame"></iframe>
</div>

</div>

<footer>
<img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn">
<span>IkeBagus 2026</span>
</footer>

</div>

<script>
function login(){
let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234"){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Username atau Password salah!");
}
}

function loadPage(page){
document.getElementById("frame").src=page;
}
</script>

</body>
</html>

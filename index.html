<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Keuangan Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-peach: #ffcbba;
            --soft-white: #fff5f2;
        }

        body {
            background-color: var(--soft-white);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* Animasi Logo Login */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .animated-logo {
            animation: float 4s ease-in-out infinite;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(244, 164, 130, 0.3);
        }

        /* Header Floating dengan Transisi Smooth */
        #mainHeader {
            background: var(--pink-peach);
            border-radius: 25px;
            margin: 15px 20px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
        }

        /* Class untuk menyembunyikan header */
        .header-hidden {
            margin: 0 !important;
            padding: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            transform: translateY(-100px) !important;
            overflow: hidden;
            pointer-events: none;
        }

        /* Sidebar Tipis */
        .sidebar {
            width: 60px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border-right: 1px solid var(--pink-peach);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        .sidebar:hover { width: 240px; }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            color: #7d7d7d;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .sidebar-item:hover { background: var(--pink-peach); color: white; }

        .sidebar-item span {
            margin-left: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sidebar:hover .sidebar-item span { opacity: 1; }

        /* Iframe Container */
        .iframe-container {
            flex: 1;
            padding: 10px;
            background: #fffafa;
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        #mainIframe {
            width: 100%;
            height: 100%;
            border: 2px solid var(--pink-peach);
            border-radius: 20px;
            background: white;
        }

        /* Tombol Restore Header (Muncul saat header hilang) */
        #restoreBtn {
            position: fixed;
            top: 10px;
            right: 25px;
            background: var(--pink-peach);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex flex-col justify-center items-center">
        <div class="bg-white/90 backdrop-blur-md p-10 rounded-[50px] shadow-2xl w-[90%] max-w-md text-center">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="animated-logo w-28 h-28 mx-auto mb-6 object-cover">
            <h1 class="text-2xl font-bold text-pink-500 mb-8 leading-tight">Ikapuspaqilla Salon<br><span class="text-sm font-light text-gray-500 uppercase tracking-widest">Dashboard Management</span></h1>
            
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-300 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-300 outline-none">
                <button onclick="checkLogin()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95 shadow-pink-200">MASUK</button>
            </div>
            <p id="errorMsg" class="text-red-400 mt-4 hidden">Akses Ditolak!</p>
        </div>
    </div>

    <div id="dashboardApp" class="hidden h-screen flex flex-col">
        
        <div id="restoreBtn" onclick="toggleHeader()">Tampilkan Header <i class="fas fa-chevron-down ml-1"></i></div>

        <header id="mainHeader">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="w-16 h-16 mx-auto mb-1 rounded-full border-2 border-white shadow-md">
            <h2 class="text-white text-xl font-bold uppercase tracking-widest">Dasboard Management Keuangan Salon</h2>
        </header>

        <div class="flex flex-1 overflow-hidden">
            <div class="sidebar shadow-xl">
                <div class="sidebar-item" onclick="changeSrc('Jurnal.html')">
                    <i class="fas fa-file-invoice-dollar"></i><span>Jurnal Keuangan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Pengeluaran.html')">
                    <i class="fas fa-wallet"></i><span>Pengeluaran Bulanan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Omset.html')">
                    <i class="fas fa-chart-line"></i><span>Omset Bulanan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Komisi.html')">
                    <i class="fas fa-cut"></i><span>Komisi Karyawan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Member.html')">
                    <i class="fas fa-heart"></i><span>Daftar Member</span>
                </div>
            </div>

            <div class="iframe-container">
                <iframe id="mainIframe" name="mainIframe" src="about:blank"></iframe>
            </div>
        </div>

        <footer class="flex justify-center items-center py-3 bg-white border-t border-pink-100 text-pink-400 text-xs font-bold">
            <img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn" alt="Footer Logo" class="w-6 h-6 mr-2 rounded-full">
            IkeBagus 2026
        </footer>
    </div>

    <script>
        function checkLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === '1234') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardApp').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        // FUNGSI UTAMA: Ganti Source & Sembunyikan Header
        function changeSrc(fileName) {
            const iframe = document.getElementById('mainIframe');
            const header = document.getElementById('mainHeader');
            const restoreBtn = document.getElementById('restoreBtn');

            // 1. Ganti Source Iframe
            iframe.src = fileName;

            // 2. Sembunyikan Header dengan animasi
            header.classList.add('header-hidden');
            
            // 3. Munculkan tombol restore setelah header hilang
            setTimeout(() => {
                restoreBtn.style.display = 'block';
            }, 500);
        }

        // Fungsi untuk memunculkan kembali header jika dibutuhkan
        function toggleHeader() {
            const header = document.getElementById('mainHeader');
            const restoreBtn = document.getElementById('restoreBtn');

            header.classList.remove('header-hidden');
            restoreBtn.style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ikapuspaqilla Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background-color: #FFF5F0; color: #4A2C2A; overflow: hidden; }
        
        /* Animasi */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Animasi Logo Bergerak */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-fade-in-down { animation: fadeInDown 0.8s ease-out; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out; }
        .animate-slide-in-left { animation: slideInLeft 0.5s ease-out forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FFB5A7; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #E07A5F; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="loginPage" class="fixed inset-0 bg-[#FFF5F0] z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-sm md:max-w-md border border-pink-100 animate-fade-in-up">
            <div class="text-center mb-6 md:mb-8">
                <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="h-20 w-20 md:h-24 md:w-24 rounded-full border-4 border-pink-100 mx-auto mb-4 md:mb-6 animate-float shadow-lg">
                
                <h2 class="text-xl md:text-2xl font-bold text-pink-900 mb-1 md:mb-2">Selamat Datang</h2>
                <h3 class="text-lg md:text-xl font-semibold text-pink-700 mb-1 md:mb-2">Ikapuspaqilla Salon</h3>
                <p class="text-pink-600 text-xs md:text-sm">Silahkan Login terlebih dahulu</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-pink-800 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 md:py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-pink-800 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 md:py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300">
                </div>
                <button type="submit" class="w-full bg-pink-500 text-white py-3 rounded-xl font-semibold hover:bg-pink-600 transition duration-300 shadow-md hover:shadow-lg">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardPage" class="hidden flex flex-col h-screen">
        <header class="fixed top-2 md:top-4 left-2 md:left-4 right-2 md:right-4 z-40 animate-fade-in-down">
            <div class="bg-white/90 backdrop-blur-sm shadow-lg rounded-full px-4 md:px-6 py-2 md:py-3 flex items-center justify-between border border-pink-100">
                <div class="flex items-center gap-2 md:gap-4">
                    <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="h-10 w-10 md:h-12 md:w-12 rounded-full border-2 border-pink-200">
                    <h1 class="text-sm md:text-xl font-bold text-pink-900 truncate max-w-[150px] md:max-w-none">Salon Dashboard</h1>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <button onclick="handleLogout()" class="text-xs bg-pink-100 text-pink-700 px-3 md:px-4 py-1.5 md:py-2 rounded-full hover:bg-pink-200 font-semibold">Keluar</button>
                </div>
            </div>
        </header>

        <div class="flex flex-1 pt-16 md:pt-24 pb-12 md:pb-16 overflow-hidden">
            <nav class="w-16 md:w-20 flex flex-col items-center bg-white shadow-md rounded-r-3xl mr-2 md:mr-4 ml-1 md:ml-2 my-2 py-4 md:py-8 gap-4 md:gap-6 animate-slide-in-left border-r border-pink-50 sidebar-scroll overflow-y-auto">
                <button onclick="loadPage('Jurnal.html')" class="group relative flex flex-col items-center gap-2" title="Jurnal Keuangan">
                    <div class="p-3 md:p-4 rounded-xl md:rounded-2xl bg-pink-50 group-hover:bg-pink-100 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-pink-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    </div>
                </button>
                <button onclick="loadPage('Pengeluaran.html')" class="group relative flex flex-col items-center gap-2" title="Pengeluaran Bulanan">
                    <div class="p-3 md:p-4 rounded-xl md:rounded-2xl bg-pink-50 group-hover:bg-pink-100 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-pink-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2h-9a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>
                    </div>
                </button>
                <button onclick="loadPage('Omset.html')" class="group relative flex flex-col items-center gap-2" title="Omset Bulanan">
                    <div class="p-3 md:p-4 rounded-xl md:rounded-2xl bg-pink-50 group-hover:bg-pink-100 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-pink-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                </button>
                <button onclick="loadPage('Member.html')" class="group relative flex flex-col items-center gap-2" title="Daftar Member">
                    <div class="p-3 md:p-4 rounded-xl md:rounded-2xl bg-pink-50 group-hover:bg-pink-100 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-pink-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                </button>
            </nav>

            <main class="flex-1 bg-white rounded-3xl shadow-inner mr-2 md:mr-4 my-2 overflow-hidden border border-pink-50 animate-fade-in-up">
                <iframe id="contentFrame" src="Jurnal.html" class="w-full h-full border-none" title="Dashboard Content"></iframe>
            </main>
        </div>

        <footer class="fixed bottom-0 left-0 right-0 h-10 md:h-12 bg-white/80 backdrop-blur-sm border-t border-pink-100 flex items-center justify-center gap-2 md:gap-3 animate-fade-in-up z-40">
            <img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn" alt="Footer Logo" class="h-4 w-4 md:h-6 md:w-6 rounded-full">
            <p class="text-xs md:text-sm text-pink-800 font-medium">IkeBagus 2026</p>
        </footer>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'admin' && password === '1234') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
            } else {
                alert('Username atau Password salah!');
            }
        }

        function handleLogout() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function loadPage(pageUrl) {
            const frame = document.getElementById('contentFrame');
            frame.style.opacity = 0;
            setTimeout(() => {
                frame.src = pageUrl;
                frame.style.opacity = 1;
            }, 300);
        }
        
        const frame = document.getElementById('contentFrame');
        frame.style.transition = 'opacity 0.3s ease-in-out';
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Keuangan Salon</title>
    <style>
        :root {
            --primary-color: #FFDAB9; /* Pink Peach */
            --secondary-color: #FFC0CB; /* Pink */
            --dark-color: #5D4037;
            --text-color: #333;
            --bg-color: #FFF5F0;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* --- Animasi --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* --- Halaman Login --- */
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF5F0 0%, #FFDAB9 100%);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1s ease-out;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 4px solid var(--secondary-color);
            animation: floatLogo 3s infinite ease-in-out;
        }

        .login-container h2 {
            margin-bottom: 10px;
            color: var(--dark-color);
            font-size: 1.5rem;
        }

        .login-container p {
            margin-bottom: 30px;
            color: #666;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--secondary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #FF9AA2;
            transform: scale(1.02);
        }

        /* --- Main Dashboard --- */
        #dashboard-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
        }

        /* Header Floating */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            background: rgba(255, 218, 185, 0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            z-index: 1000;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease-out;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--dark-color);
        }

        /* Layout Utama */
        .main-container {
            display: flex;
            margin-top: 100px; /* Space for fixed header */
            flex: 1;
        }

        /* Sidebar Tipis */
        nav {
            width: 60px;
            background: white;
            padding: 20px 10px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-radius: 0 20px 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
        }

        nav:hover {
            width: 200px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark-color);
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item:hover {
            background-color: var(--primary-color);
        }

        .nav-item span {
            opacity: 0;
            transition: var(--transition);
        }

        nav:hover .nav-item span {
            opacity: 1;
        }

        .icon {
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
        }

        /* Iframe Area */
        .content-area {
            flex: 1;
            padding: 20px;
            height: calc(100vh - 100px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: fadeIn 1s ease-out;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background: white;
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: var(--dark-color);
            border-top: 1px solid #eee;
        }

        .footer-logo {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            header {
                padding: 10px 15px;
                top: 10px;
            }
            header h1 { font-size: 0.9rem; }
            .header-logo { width: 35px; height: 35px; }

            .main-container {
                margin-top: 70px;
                flex-direction: column;
            }

            nav {
                width: 100%;
                height: auto;
                position: relative;
                top: 0;
                flex-direction: row;
                justify-content: space-around;
                border-radius: 0 0 20px 20px;
                padding: 10px;
            }
            
            nav:hover { width: 100%; }
            .nav-item span { display: none; } /* Hide text on mobile */
            .nav-item { padding: 8px; }

            .content-area {
                height: calc(100vh - 170px);
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-container">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="login-logo">
            <h2>Selamat Datang</h2>
            <p>di Dashboard Ikapuspaqilla Salon<br>Silahkan Login terlebih dahulu</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <button class="login-btn" onclick="checkLogin()">Login</button>
        </div>
    </div>

    <div id="dashboard-page">
        <header>
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="header-logo">
            <h1>Dasboard Management Keuangan Salon</h1>
        </header>

        <div class="main-container">
            <nav>
                <a href="#" class="nav-item" onclick="loadContent('Jurnal')">
                    <span class="icon">📖</span> <span>Jurnal Keuangan</span>
                </a>
                <a href="#" class="nav-item" onclick="loadContent('Pengeluaran')">
                    <span class="icon">💸</span> <span>Pengeluaran Bulanan</span>
                </a>
                <a href="#" class="nav-item" onclick="loadContent('Omset')">
                    <span class="icon">📈</span> <span>Omset Bulanan</span>
                </a>
                <a href="#" class="nav-item" onclick="loadContent('Komisi')">
                    <span class="icon">🧑‍💼</span> <span>Komisi Karyawan</span>
                </a>
                <a href="#" class="nav-item" onclick="loadContent('Member')">
                    <span class="icon">💳</span> <span>Daftar Member</span>
                </a>
            </nav>

            <div class="content-area">
                <iframe id="main-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <footer>
            <img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn" alt="Logo" class="footer-logo">
            <p>IkeBagus 2026</p>
        </footer>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === '1234') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'flex';
                // Load default content
                loadContent('Jurnal');
            } else {
                alert('Username atau Password Salah!');
            }
        }

        function loadContent(page) {
            const iframe = document.getElementById('main-iframe');
            
            // --- BAGIAN UNTUK PASTE HTML ANDA ---
            // Ganti 'about:blank' dengan path file html Anda atau gunakan data:text/html
            
            let content = "";
            switch(page) {
                case 'Jurnal':
                    content = '<h1>Halaman Jurnal Keuangan</h1><p>Paste kode HTML jurnal disini.</p>';
                    break;
                case 'Pengeluaran':
                    content = '<h1>Halaman Pengeluaran</h1><p>Paste kode HTML pengeluaran disini.</p>';
                    break;
                case 'Omset':
                    content = '<h1>Halaman Omset</h1><p>Paste kode HTML omset disini.</p>';
                    break;
                case 'Komisi':
                    content = '<h1>Halaman Komisi</h1><p>Paste kode HTML komisi disini.</p>';
                    break;
                case 'Member':
                    content = '<h1>Halaman Member</h1><p>Paste kode HTML member disini.</p>';
                    break;
            }
            
            // Menggunakan data:text/html untuk simulasi konten iframe dalam satu file
            iframe.srcdoc = `
                <html>
                    <body style="font-family: sans-serif; padding: 20px; color: #333;">
                        ${content}
                    </body>
                </html>
            `;
        }
    </script>
</body>
</html>

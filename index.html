<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Management Keuangan Salon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--primary:#ff8fab;
--secondary:#ffb3c6;
--glass:rgba(255,255,255,0.25);
--text:#ffffff;
--bg:linear-gradient(135deg,#ffd6e0,#ffb7c5,#ffc2d1);
}

body.dark{
--glass:rgba(30,30,30,0.6);
--text:#ffffff;
--bg:linear-gradient(135deg,#2b2b2b,#1f1f1f);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:var(--bg);
min-height:100vh;
transition:0.5s;
color:var(--text);
}

/* LOGIN */
#loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:var(--glass);
backdrop-filter:blur(20px);
padding:40px;
border-radius:30px;
width:90%;
max-width:420px;
text-align:center;
animation:float 4s infinite ease-in-out;
}

.login-box img{
width:130px;height:130px;border-radius:50%;
animation:rotate 12s linear infinite;
}

.login-box h2{margin:20px 0;}

.login-box input{
width:100%;padding:12px;margin:10px 0;
border:none;border-radius:15px;
}

.login-box button{
width:100%;padding:12px;margin-top:10px;
border:none;border-radius:20px;
background:var(--primary);
color:white;cursor:pointer;
}

/* DASHBOARD */
#dashboard{display:none;padding:20px;}

.topbar{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:20px;
}

.toggle-dark{
cursor:pointer;padding:8px 15px;
border-radius:20px;background:var(--glass);
}

.logout{
cursor:pointer;padding:8px 15px;
border-radius:20px;background:#ff6f91;color:white;border:none;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;margin-bottom:30px;
}

.card{
background:var(--glass);
backdrop-filter:blur(20px);
padding:25px;border-radius:25px;
text-align:center;
animation:fadeUp 1s ease;
}

.card h3{font-size:28px;margin-top:10px;}

.chart-box{
background:var(--glass);
backdrop-filter:blur(20px);
padding:20px;border-radius:25px;
margin-bottom:30px;
}

/* Sidebar */
.sidebar{
position:fixed;bottom:0;left:0;width:100%;
display:flex;justify-content:space-around;
background:var(--glass);
backdrop-filter:blur(20px);
padding:10px 0;
border-radius:30px 30px 0 0;
}

.sidebar button{
border:none;background:none;color:var(--text);
font-size:12px;cursor:pointer;
}

/* Loader */
.loader{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.4);
display:none;justify-content:center;align-items:center;
z-index:999;
}

.loader div{
width:50px;height:50px;border:5px solid white;
border-top:5px solid var(--primary);
border-radius:50%;
animation:spin 1s linear infinite;
}

/* Toast */
.toast{
position:fixed;top:20px;right:20px;
background:var(--primary);
padding:15px 20px;
border-radius:20px;
color:white;
display:none;
}

/* Animations */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rotate{to{transform:rotate(360deg);}}
@keyframes float{50%{transform:translateY(-10px);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;}}

</style>
</head>
<body>

<div id="loginPage">
<div class="login-box">
<img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s">
<h2>Selamat Datang di Dashboard Ikapuspaqilla Salon</h2>
<input type="text" id="username">
<input type="password" id="password">
<button onclick="login()">Login</button>
</div>
</div>

<div id="dashboard">

<div class="topbar">
<h2>Dashboard Statistik</h2>
<div>
<span class="toggle-dark" onclick="toggleDark()">Dark Mode</span>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>

<div class="cards">
<div class="card">
<p>Total Omset</p>
<h3>Rp 25jt</h3>
</div>
<div class="card">
<p>Pengeluaran</p>
<h3>Rp 10jt</h3>
</div>
<div class="card">
<p>Member</p>
<h3>120</h3>
</div>
<div class="card">
<p>Komisi</p>
<h3>Rp 5jt</h3>
</div>
</div>

<div class="chart-box">
<canvas id="myChart"></canvas>
</div>

</div>

<div class="sidebar">
<button onclick="showToast('Jurnal Keuangan dibuka')">Jurnal</button>
<button onclick="showToast('Pengeluaran dibuka')">Pengeluaran</button>
<button onclick="showToast('Omset dibuka')">Omset</button>
<button onclick="showToast('Komisi dibuka')">Komisi</button>
<button onclick="showToast('Member dibuka')">Member</button>
</div>

<div class="loader" id="loader"><div></div></div>
<div class="toast" id="toast"></div>

<script>
function login(){
if(username.value==="admin" && password.value==="1234"){
loginPage.style.display="none";
dashboard.style.display="block";
initChart();
showToast("Login Berhasil 🎉");
}else{
showToast("Username atau Password salah!");
}
}

function logout(){
dashboard.style.display="none";
loginPage.style.display="flex";
showToast("Berhasil Logout");
}

function toggleDark(){
document.body.classList.toggle("dark");
showToast("Mode Tampilan Diubah");
}

function showToast(msg){
let toast=document.getElementById("toast");
toast.innerText=msg;
toast.style.display="block";
setTimeout(()=>{toast.style.display="none";},3000);
}

function initChart(){
new Chart(document.getElementById("myChart"),{
type:'line',
data:{
labels:["Jan","Feb","Mar","Apr","Mei","Jun"],
datasets:[{
label:"Omset",
data:[5,7,6,9,10,12],
borderColor:"#ff6f91",
backgroundColor:"rgba(255,111,145,0.2)",
fill:true,
tension:0.4
}]
}
});
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Keuangan Salon</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary-peach: #FFDAB9;
            --soft-pink: #FFC0CB;
            --dark-peach: #e9c4a6;
            --text-dark: #5D4037;
            --white: #ffffff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: #fff5f2;
            color: var(--text-dark);
            overflow: hidden; /* Prevent body scroll */
            height: 100vh;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseLogo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes rotateLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- LOGIN PAGE STYLE --- */
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-peach) 0%, var(--soft-pink) 100%);
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
            animation: fadeInDown 0.8s ease;
            backdrop-filter: blur(10px);
        }

        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            animation: pulseLogo 3s infinite;
            object-fit: cover;
            border: 4px solid var(--white);
        }

        .login-card h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: var(--text-dark);
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--soft-pink);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background-color: var(--text-dark);
            color: var(--white);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background-color: #4e342e;
            transform: translateY(-2px);
        }

        /* --- DASHBOARD STYLE --- */
        #dashboard-page {
            display: none; /* Hidden by default */
            height: 100vh;
            flex-direction: column;
        }

        /* Header Update: Tipis */
        header {
            background-color: var(--primary-peach);
            padding: 8px 20px; /* Diperkecil */
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1200px;
            border-radius: 30px; /* Lebih rounded tipis */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            z-index: 1000;
            animation: fadeInDown 0.8s ease;
        }

        .header-logo {
            width: 35px; /* Diperkecil */
            height: 35px; /* Diperkecil */
            border-radius: 50%;
            object-fit: cover;
            animation: rotateLogo 10s linear infinite; /* Animasi berputar */
        }

        header h1 {
            font-size: 16px; /* Font diperkecil */
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Main Container */
        .main-container {
            display: flex;
            margin-top: 65px; /* Space for thinner header */
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Sidebar Update: Tipis & Kecil */
        .sidebar {
            width: 50px; /* Diperkecil */
            background: var(--white);
            padding: 10px 5px; /* Diperkecil */
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            border-radius: 0 15px 15px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            overflow-x: hidden;
        }

        .sidebar:hover {
            width: 200px;
            align-items: flex-start;
        }

        .menu-item {
            width: 40px; /* Diperkecil */
            height: 40px; /* Diperkecil */
            border-radius: 12px;
            background-color: #fceae5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
            text-decoration: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .menu-item:hover {
            background-color: var(--soft-pink);
            width: 100%;
        }

        .menu-icon {
            font-size: 16px; /* Ikon diperkecil */
            min-width: 40px;
            text-align: center;
        }

        .menu-text {
            display: none;
            font-size: 13px;
            font-weight: 500;
        }

        .sidebar:hover .menu-text {
            display: inline;
            animation: fadeInDown 0.5s;
        }

        /* Content Area & Iframe Update */
        .content-area {
            flex: 1;
            padding: 10px; /* Padding lebih kecil */
            background-color: #fff5f2;
        }

        iframe {
            width: 100%;
            height: 85vh; /* Lebih tinggi untuk lega */
            border: none;
            border-radius: 15px;
            background: var(--white);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            animation: fadeInUp 0.8s ease;
        }

        /* Footer Update: Lebih tipis */
        footer {
            text-align: center;
            padding: 8px;
            background: var(--white);
            font-size: 12px;
            border-top: 1px solid #eee;
            animation: fadeInUp 0.8s ease;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 35px;
        }

        .footer-logo {
            width: 16px; /* Diperkecil */
            height: 16px; /* Diperkecil */
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            object-fit: cover;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                width: 95%;
                top: 5px;
            }
            .main-container {
                margin-top: 55px;
            }
            iframe {
                height: 80vh;
            }
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="login-logo">
            <h2>Selamat Datang di Dashboard Ikapuspaqilla Salon <br>Silahkan Login terlebih dahulu</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">LOGIN</button>
            </form>
        </div>
    </div>

    <div id="dashboard-page">
        <header>
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="header-logo">
            <h1>Dasboard Management Keuangan Salon</h1>
        </header>

        <div class="main-container">
            <nav class="sidebar">
                <a href="#" class="menu-item" onclick="loadContent('Jurnal.html')">
                    <span class="menu-icon">📊</span>
                    <span class="menu-text">Jurnal Keuangan</span>
                </a>
                <a href="#" class="menu-item" onclick="loadContent('Pengeluaran.html')">
                    <span class="menu-icon">💸</span>
                    <span class="menu-text">Pengeluaran</span>
                </a>
                <a href="#" class="menu-item" onclick="loadContent('Omset.html')">
                    <span class="menu-icon">📈</span>
                    <span class="menu-text">Omset Bulanan</span>
                </a>
                <a href="#" class="menu-item" onclick="loadContent('Komisi.html')">
                    <span class="menu-icon">👥</span>
                    <span class="menu-text">Komisi Karyawan</span>
                </a>
                <a href="#" class="menu-item" onclick="loadContent('Member.html')">
                    <span class="menu-icon">💳</span>
                    <span class="menu-text">Daftar Member</span>
                </a>
            </nav>

            <div class="content-area">
                <iframe id="main-iframe" src="about:blank"></iframe>
            </div>
        </div>

        <footer>
            <img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn" alt="Logo Footer" class="footer-logo">
            <span>IkeBagus 2026</span>
        </footer>
    </div>

    <script>
        // Simple Login Logic
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'admin' && password === '1234') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'flex';
                // Load default page
                loadContent('about:blank'); 
            } else {
                alert('Username atau Password salah!');
            }
        }

        // Load Content into Iframe
        function loadContent(pageUrl) {
            const iframe = document.getElementById('main-iframe');
            iframe.src = pageUrl;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Management Keuangan Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --pink-peach: #ffcbba;
            --dark-peach: #f4a482;
            --soft-white: #fff5f2;
        }

        body {
            background-color: var(--soft-white);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* Animasi Logo Melayang */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .animated-logo {
            animation: float 4s ease-in-out infinite;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 10px 25px rgba(244, 164, 130, 0.3);
        }

        /* Header Floating */
        .header-floating {
            background: var(--pink-peach);
            border-radius: 25px;
            margin: 15px 20px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 50;
        }

        /* Sidebar Tipis (Auto Expand) */
        .sidebar {
            width: 60px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border-right: 1px solid var(--pink-peach);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        .sidebar:hover {
            width: 240px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            color: #7d7d7d;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .sidebar-item:hover {
            background: var(--pink-peach);
            color: white;
        }

        .sidebar-item i {
            min-width: 25px;
            font-size: 1.2rem;
            text-align: center;
        }

        .sidebar-item span {
            margin-left: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sidebar:hover .sidebar-item span {
            opacity: 1;
        }

        /* Kontainer Iframe */
        .iframe-container {
            flex: 1;
            padding: 15px;
            background: #fffafa;
            display: flex;
            flex-direction: column;
        }

        #mainIframe {
            width: 100%;
            height: 100%;
            border: 2px solid var(--pink-peach);
            border-radius: 20px;
            background: white;
        }

        #loginPage {
            background: linear-gradient(135deg, #fff5f2 0%, #ffcbba 100%);
            display: flex;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex flex-col justify-center items-center">
        <div class="bg-white/90 backdrop-blur-md p-10 rounded-[50px] shadow-2xl w-[90%] max-w-md text-center">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="animated-logo w-28 h-28 mx-auto mb-6 object-cover">
            <h2 class="text-lg text-gray-500">Selamat Datang di</h2>
            <h1 class="text-2xl font-bold text-pink-500 mb-8">Dashboard Ikapuspaqilla Salon</h1>
            
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-300 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full px-6 py-4 rounded-2xl bg-gray-50 border-none focus:ring-2 focus:ring-pink-300 outline-none">
                <button onclick="checkLogin()" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-transform active:scale-95">
                    LOGIN
                </button>
            </div>
            <p id="errorMsg" class="text-red-400 mt-4 hidden text-sm font-semibold">Akses Ditolak!</p>
        </div>
    </div>

    <div id="dashboardApp" class="hidden h-screen flex flex-col">
        
        <div class="header-floating">
            <img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s" alt="Logo" class="w-16 h-16 mx-auto mb-1 rounded-full border-2 border-white shadow-md">
            <h2 class="text-white text-xl font-bold uppercase tracking-widest">Dasboard Management Keuangan Salon</h2>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="sidebar shadow-xl">
                <div class="sidebar-item" onclick="changeSrc('Jurnal.html')">
                    <i class="fas fa-file-invoice-dollar"></i><span>Jurnal Keuangan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Pengeluaran.html')">
                    <i class="fas fa-wallet"></i><span>Pengeluaran Bulanan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Omset.html')">
                    <i class="fas fa-chart-line"></i><span>Omset Bulanan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Komisi.html')">
                    <i class="fas fa-cut"></i><span>Komisi Karyawan</span>
                </div>
                <div class="sidebar-item" onclick="changeSrc('Member.html')">
                    <i class="fas fa-heart"></i><span>Daftar Member</span>
                </div>
            </div>

            <div class="iframe-container">
                <iframe id="mainIframe" name="mainIframe" src="about:blank" title="Content Area"></iframe>
            </div>
        </div>

        <footer class="flex justify-center items-center py-3 bg-white border-t border-pink-100 text-pink-400 text-xs font-bold">
            <img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn" alt="Footer Logo" class="w-6 h-6 mr-2 rounded-full">
            IkeBagus 2026
        </footer>
    </div>

    <script>
        // Logika Login
        function checkLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === '1234') {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardApp').classList.remove('hidden');
                // Set default page saat login berhasil
                changeSrc('jurnal.html'); 
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        // FUNGSI PENGGANTI SRC IFRAME
        function changeSrc(fileName) {
            const iframe = document.getElementById('mainIframe');
            
            // JIKA FILE ADA DI REPO YANG SAMA (Folder yang sama di GitHub)
            // Cukup panggil nama filenya saja
            iframe.src = fileName;

            // Jika file ada di repo lain, gunakan URL lengkap:
            // iframe.src = "https://username.github.io/repo-name/" + fileName;
        }
    </script>
</body>
</html>

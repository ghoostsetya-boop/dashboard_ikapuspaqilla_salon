<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Management Keuangan Salon</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e0,#ffb7c5,#ffc2d1);
min-height:100vh;
overflow-x:hidden;
}

/* ========= LOGIN ========= */

#loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
animation:fadeIn 1.5s ease;
}

.login-box{
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.25);
padding:40px;
border-radius:30px;
box-shadow:0 20px 50px rgba(0,0,0,0.2);
text-align:center;
width:90%;
max-width:420px;
border:1px solid rgba(255,255,255,0.4);
animation:float 4s ease-in-out infinite;
}

.login-box img{
width:140px;
height:140px;
border-radius:50%;
margin-bottom:20px;
animation:rotateLogo 12s linear infinite;
box-shadow:0 10px 30px rgba(255,105,135,0.4);
}

.login-box h2{
color:#fff;
margin-bottom:25px;
font-weight:600;
}

.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:15px;
outline:none;
background:rgba(255,255,255,0.6);
}

.login-box button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#ff8fab,#ff6f91);
color:white;
font-weight:600;
cursor:pointer;
transition:0.4s;
}

.login-box button:hover{
transform:scale(1.05);
}

/* ========= DASHBOARD ========= */

#dashboard{
display:none;
animation:fadeIn 1s ease;
}

/* HEADER */
header{
margin:20px;
padding:25px;
border-radius:30px;
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.25);
border:1px solid rgba(255,255,255,0.4);
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

header .title{
display:flex;
align-items:center;
gap:15px;
}

header img{
width:70px;
border-radius:50%;
}

header h1{
color:white;
font-size:20px;
}

.logout{
background:#ff6f91;
border:none;
padding:10px 20px;
border-radius:20px;
color:white;
cursor:pointer;
transition:0.3s;
}

.logout:hover{
transform:scale(1.1);
}

/* LAYOUT */
.container{
display:flex;
padding:0 20px;
}

/* SIDEBAR MODERN */
.sidebar{
width:80px;
height:75vh;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(15px);
border-radius:30px;
padding:20px 10px;
display:flex;
flex-direction:column;
gap:15px;
transition:0.4s;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.sidebar:hover{
width:200px;
}

.sidebar button{
border:none;
background:none;
padding:12px;
border-radius:15px;
color:white;
cursor:pointer;
text-align:left;
transition:0.3s;
display:flex;
align-items:center;
gap:10px;
}

.sidebar button:hover{
background:rgba(255,255,255,0.4);
}

.sidebar button.active{
background:white;
color:#ff6f91;
font-weight:600;
}

/* CONTENT */
.content{
flex:1;
margin-left:20px;
}

iframe{
width:100%;
height:75vh;
border:none;
border-radius:30px;
background:white;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* FOOTER */
footer{
margin:20px;
padding:15px;
text-align:center;
border-radius:30px;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(15px);
color:white;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

footer img{
width:35px;
}

/* ANIMASI */
@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

@keyframes rotateLogo{
0%{transform:rotate(0);}
100%{transform:rotate(360deg);}
}

/* RESPONSIVE */
@media(max-width:768px){
.container{
flex-direction:column;
}
.sidebar{
flex-direction:row;
width:100%;
height:auto;
overflow-x:auto;
}
.sidebar:hover{
width:100%;
}
.content{
margin-left:0;
margin-top:15px;
}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-box">
<img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s">
<h2>Selamat Datang di Dashboard Ikapuspaqilla Salon<br>Silahkan Login terlebih dahulu</h2>
<input type="text" id="username">
<input type="password" id="password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<header>
<div class="title">
<img src="https://lh3.googleusercontent.com/d/1rTcKE5xcEHCqgLIEK4eoep36Z0ZvRR3s">
<h1>Dashboard Management Keuangan Salon</h1>
</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="sidebar">
<button onclick="loadPage(this,'jurnal.html')">Jurnal Keuangan</button>
<button onclick="loadPage(this,'pengeluaran.html')">Pengeluaran</button>
<button onclick="loadPage(this,'omset.html')">Omset</button>
<button onclick="loadPage(this,'komisi.html')">Komisi Karyawan</button>
<button onclick="loadPage(this,'member.html')">Daftar Member</button>
</div>

<div class="content">
<iframe id="frame"></iframe>
</div>

</div>

<footer>
<img src="https://lh3.googleusercontent.com/d/1AcUPbZdtoKhbAEDhLgg4102LwKpQeRBn">
<span>IkeBagus 2026</span>
</footer>

</div>

<script>
function login(){
let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234"){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";
}else{
alert("Username atau Password salah!");
}
}

function logout(){
document.getElementById("dashboard").style.display="none";
document.getElementById("loginPage").style.display="flex";
}

function loadPage(el,page){
document.getElementById("frame").src=page;

let buttons=document.querySelectorAll(".sidebar button");
buttons.forEach(btn=>btn.classList.remove("active"));
el.classList.add("active");
}
</script>

</body>
</html>

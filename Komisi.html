<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komisi Karyawan</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Poppins', sans-serif; }
    .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
    .popup-overlay { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); }
    .gradient-pink { background: linear-gradient(135deg, #FFB5BA 0%, #FFC4C4 50%, #FFD5D8 100%); }
    .gradient-dark-pink { background: linear-gradient(135deg, #E91E63 0%, #F06292 100%); }
    .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .table-row:hover { background: rgba(233, 30, 99, 0.05); }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-pink-50 via-white to-rose-50">
  <div id="app" class="h-full overflow-auto">
    <header class="gradient-pink shadow-xl mx-4 mt-4 rounded-3xl animate-fadeIn relative overflow-hidden p-6 text-center">
      <h1 class="text-3xl font-bold text-gray-800 tracking-wide">Komisi Karyawan</h1>
      <p class="text-gray-600 mt-1 text-sm">Sistem Manajemen Komisi</p>
    </header>

    <main class="mx-4 mt-6 mb-6">
      <div class="glass-effect rounded-2xl shadow-lg overflow-hidden">
        <div class="flex justify-between items-center p-4 border-b border-pink-100">
          <h2 class="text-lg font-semibold text-gray-700">Data Komisi</h2>
          <button onclick="openPopup()" class="gradient-dark-pink text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg hover:opacity-90 transition-all flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Input Data
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="gradient-dark-pink text-white">
              <tr>
                <th class="px-4 py-3 text-left text-sm font-semibold">Tanggal</th>
                <th class="px-4 py-3 text-left text-sm font-semibold">Nama</th>
                <th class="px-4 py-3 text-right text-sm font-semibold">Total</th>
                <th class="px-4 py-3 text-center text-sm font-semibold">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-pink-100">
              </tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="popup" class="fixed inset-0 popup-overlay z-50 hidden items-center justify-center p-4">
      <div class="glass-effect rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="gradient-dark-pink p-4 text-white flex justify-between items-center">
          <h2 id="popupTitle" class="font-bold">Tambah Data</h2>
          <button onclick="closePopup()" class="text-2xl">&times;</button>
        </div>
        <form id="dataForm" onsubmit="submitForm(event)" class="p-6 space-y-4">
          <input type="hidden" id="editIndex">
          <div>
            <label class="block text-sm text-gray-600">Tanggal</label>
            <input type="date" id="inputTanggal" required class="w-full border-2 border-pink-100 rounded-xl p-2 focus:border-pink-400 outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-600">Nama Karyawan</label>
            <input type="text" id="inputNama" required class="w-full border-2 border-pink-100 rounded-xl p-2 focus:border-pink-400 outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-600">Total Komisi</label>
            <input type="number" id="inputTotal" required class="w-full border-2 border-pink-100 rounded-xl p-2 focus:border-pink-400 outline-none">
          </div>
          <button type="submit" class="w-full gradient-dark-pink text-white py-3 rounded-xl font-bold">Simpan Data</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let komisiData = JSON.parse(localStorage.getItem('komisi_data')) || [];

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (komisiData.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Tidak ada data.</td></tr>';
        return;
      }

      komisiData.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'table-row transition-all';
        row.innerHTML = `
          <td class="px-4 py-3 text-sm">${item.tanggal}</td>
          <td class="px-4 py-3 text-sm font-medium">${item.nama}</td>
          <td class="px-4 py-3 text-sm text-right">Rp ${parseInt(item.total).toLocaleString()}</td>
          <td class="px-4 py-3 text-center">
            <div class="flex justify-center gap-2">
              <button onclick="editData(${index})" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button onclick="deleteData(${index})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function deleteData(index) {
      if (confirm('Apakah Anda yakin ingin menghapus data pada baris ini?')) {
        // Menghapus data berdasarkan indeks baris yang diklik
        komisiData.splice(index, 1); 
        saveAndRender();
      }
    }

    function editData(index) {
      const item = komisiData[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('inputTanggal').value = item.tanggal;
      document.getElementById('inputNama').value = item.nama;
      document.getElementById('inputTotal').value = item.total;
      document.getElementById('popupTitle').innerText = 'Edit Data Komisi';
      openPopup();
    }

    function submitForm(e) {
      e.preventDefault();
      const index = document.getElementById('editIndex').value;
      const newData = {
        tanggal: document.getElementById('inputTanggal').value,
        nama: document.getElementById('inputNama').value,
        total: document.getElementById('inputTotal').value
      };

      if (index === "") {
        komisiData.push(newData);
      } else {
        komisiData[index] = newData;
      }

      saveAndRender();
      closePopup();
    }

    function saveAndRender() {
      localStorage.setItem('komisi_data', JSON.stringify(komisiData));
      renderTable();
    }

    function openPopup() {
      document.getElementById('popup').classList.remove('hidden');
      document.getElementById('popup').classList.add('flex');
    }

    function closePopup() {
      document.getElementById('popup').classList.add('hidden');
      document.getElementById('popup').classList.remove('flex');
      document.getElementById('dataForm').reset();
      document.getElementById('editIndex').value = "";
      document.getElementById('popupTitle').innerText = 'Tambah Data';
    }

    // Inisialisasi awal
    renderTable();
  </script>
</body>
</html>
